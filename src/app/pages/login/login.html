<div class="login-page">
  <div class="login-image">
    <div class="image-overlay">
      <img
        src="logo-legio-mariae.png"
        alt="Legião de Maria"
      />

      <h1>Legião de Maria</h1>

      <p>
        A missão que transforma corações.
      </p>
    </div>
  </div>

  <div class="login-content">

    <div class="login-form">

      <h2>Bem-vindo!</h2>

      <p class="subtitle">
        Entre na sua conta para continuar.
      </p>

      <form
        #loginForm="ngForm"
        (ngSubmit)="entrar()"
      >

        <div class="form-group">
          <label for="email">E-mail</label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            [(ngModel)]="email"
            required
            email
            [disabled]="carregando"
          />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>

          <input
            id="password"
            name="senha"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            [(ngModel)]="senha"
            required
            [disabled]="carregando"
          />
        </div>

        <div class="forgot-password">
          <a
            href="#"
            (click)="$event.preventDefault()"
            title="Será implementado na etapa de recuperação de senha"
          >
            Esqueci minha senha
          </a>
        </div>

        @if (erro) {
          <div
            class="login-error"
            role="alert"
          >
            {{ erro }}
          </div>
        }

        <button
          type="submit"
          [disabled]="carregando || loginForm.invalid"
        >
          @if (carregando) {
            Entrando...
          } @else {
            Entrar
          }
        </button>

      </form>

    </div>

  </div>

</div>
