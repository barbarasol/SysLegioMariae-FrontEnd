<div class="login-page">
  <div class="login-image">
    <div class="image-overlay">
      <img
        src="logo-legio-mariae.png"
        alt="Legião de Maria"
      />

      <h1>Sys Legio Mariae</h1>

      <p>
        Legião de Maria, que nome bem escolhido! (Pio XI)
      </p>
    </div>
  </div>

  <div class="login-content">

    <div class="login-form">

      <h2>Bem-vindo!</h2>

      <p class="subtitle">
        Entre na sua conta para continuar.
      </p>

      @if (aviso) {
        <div
          role="status"
          style="
            display: block;
            color: #664d03;
            background-color: #fff3cd;
            border: 1px solid #ffecb5;
            padding: 16px;
            margin: 16px 0;
            border-radius: 8px;
          "
        >
          <strong>Cadastro realizado!</strong>
          <br>
          {{ aviso }}
        </div>
      }

      <form
        #loginForm="ngForm"
        (ngSubmit)="entrar()"
      >

        <div class="form-group">
          <label for="email">E-mail</label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            [(ngModel)]="email"
            (ngModelChange)="erro = ''"
            required
            email
            [disabled]="carregando"
          />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>

          <input
            id="password"
            name="senha"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            [(ngModel)]="senha"
            (ngModelChange)="erro = ''"
            required
            [disabled]="carregando"
          />
        </div>

        <div class="forgot-password">
          <a
            href="#"
            (click)="$event.preventDefault()"
            title="Será implementado na etapa de recuperação de senha"
          >
            Esqueci minha senha
          </a>
        </div>

        @if (erro) {
          <div
            style="display: block; color: #842029; background-color: #f8d7da; border: 1px solid #f5c2c7; padding: 16px; margin: 16px 0; border-radius: 8px;"
            role="alert"
          >
            <strong>Não foi possível entrar!</strong>
            <br>
            {{ erro }}

          </div>
        }

        <button
          type="submit"
          [disabled]="carregando || loginForm.invalid"
        >
          @if (carregando) {
            Entrando...
          } @else {
            Entrar
          }
        </button>
        <button
          type="button"
          class="btn btn-outline-primary"
          (click)="criarUsuario()"
          style="width: 100%; margin-top: 12px;"
          >
          <i class="bi bi-person-plus"></i>
            Criar novo usuário
        </button>

      </form>

    </div>

  </div>

</div>
